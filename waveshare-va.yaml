# =============================================================================
# Waveshare ESP32-S3-AUDIO-Board voice assistant - YOUR config.
# This thin file is the only firmware file you keep locally.
# -----------------------------------------------------------------------------
# Put this file next to a secrets.yaml (copy secrets.example.yaml), edit the
# substitutions below, then:
#
#   esphome run waveshare-va.yaml
#
# The core config is fetched from this firmware's first public 2.0 beta. This
# keeps an advanced ESPHome Device Builder installation to this file and
# secrets.yaml while retaining a reproducible package revision.
# =============================================================================

substitutions:
  name: waveshare-voice
  friendly_name: "Waveshare Voice"

  # Source builds obtain Wi-Fi credentials from this local secrets file.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # Onboard amplifier volume clamps. The little speaker distorts near the top,
  # so the media player is limited to this window (0.0 - 1.0).
  volume_min: '0.4'
  volume_max: '0.8'

  # Set to 'true' only if your SSID is hidden.
  hidden_ssid: 'false'

  # Boot chime played once on connect to Home Assistant. A sound ships with the
  # firmware; uncomment to use your own (any URL or local MP3/FLAC/WAV). The
  # speaker path runs at 48 kHz and resamples other source rates as needed.
  # boot_sound_file: https://example.com/my-chime.mp3

  # Mic gain, LED brightness, wake-word sensitivity and microphone mute are all
  # exposed as entities in Home Assistant - no need to reflash to change them.

packages:
  core:
    url: https://github.com/jyoushiki/esphome-waveshare-esp32-s3-audio-va
    ref: v2.0.0-beta.2
    files:
      - base/core.yaml
    refresh: 1d

# Wi-Fi credentials come from your local secrets.yaml.
