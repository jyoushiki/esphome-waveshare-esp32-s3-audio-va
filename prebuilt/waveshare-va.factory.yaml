# Universal release build. This file contains no personal credentials and is
# compiled once for distribution as a factory image.
packages:
  firmware: !include ../waveshare-va.yaml

esphome:
  project:
    name: jyoushiki.waveshare-voice
    # The release workflow replaces this exact value with the GitHub tag.
    version: dev

# Let ESPHome Device Builder adopt the provisioned device by materializing the
# complete public configuration instead of another remote package wrapper.
dashboard_import:
  package_import_url: github://jyoushiki/esphome-waveshare-esp32-s3-audio-va/waveshare-va.yaml@main
  import_full_config: true

# Precompiled installations can update themselves without requiring ESPHome or
# enough host memory to rebuild this firmware. GitHub Pages avoids the long
# redirects used by GitHub release download URLs.
http_request:
  verify_ssl: true

ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    id: firmware_update_stable
    name: Stable firmware
    device_class: firmware
    entity_category: diagnostic
    source: https://jyoushiki.github.io/esphome-waveshare-esp32-s3-audio-va/firmware/stable/manifest.json
  - platform: http_request
    id: firmware_update_beta
    name: Beta firmware
    device_class: firmware
    entity_category: diagnostic
    disabled_by_default: true
    source: https://jyoushiki.github.io/esphome-waveshare-esp32-s3-audio-va/firmware/beta/manifest.json
