###############################################################################
# Waveshare ESP32-S3-AUDIO-Board - Home Assistant voice assistant (core)
#
# Always-on core: ES8311 DAC + speaker, ES7210 dual-mic ADC, on-device wake word
# (micro_wake_word), the full HA Assist pipeline, a media player that mixes music
# with announcements, the 7x WS2812 status ring, the three onboard buttons (via
# the TCA9555 expander) and voice timers + an alarm clock.
#
# AUDIO LAYOUT
# esp_audio_stack owns the shared ES7210/ES8311 bus in full-duplex TDM mode.
# Both physical microphones and the board's analog playback-reference channel
# feed Espressif's AFE, which performs local AEC before audio reaches wake-word
# detection or Home Assistant. The full story is below. Pinout: docs/HARDWARE.md.
###############################################################################

substitutions:
  name: waveshare-va
  friendly_name: "Waveshare Voice"

  # ---------------------------------------------------------------------------
  # Voice assistant phases - drive the LED ring state machine (see control_leds)
  # ---------------------------------------------------------------------------
  voice_assist_idle_phase_id: '1'                 # ready, waiting for a wake word
  voice_assist_waiting_for_command_phase_id: '2'  # woken, waiting for speech
  voice_assist_listening_for_command_phase_id: '3'# speech detected, recording
  voice_assist_thinking_phase_id: '4'             # STT/LLM running
  voice_assist_replying_phase_id: '5'             # TTS playing
  voice_assist_not_ready_phase_id: '10'           # no HA connection
  voice_assist_error_phase_id: '11'               # pipeline error

  # ---------------------------------------------------------------------------
  # Pins - Waveshare ESP32-S3-AUDIO-Board (see docs/HARDWARE.md). Do not change
  # unless you are on a different board.
  # ---------------------------------------------------------------------------
  i2s_mclk: GPIO12
  i2s_bclk: GPIO13          # SCLK
  i2s_lrclk: GPIO14         # LRCK/WS
  i2s_din: GPIO15           # ES7210 -> ESP (mic in)
  i2s_dout: GPIO16          # ESP -> ES8311 (speaker out)
  i2c_sda: GPIO11
  i2c_scl: GPIO10
  led_pin: GPIO38
  led_num: '7'              # WS2812 ring
  # TCA9555 expander channels. Confirmed against Waveshare's own driver code
  # (Audio_ES8311.cpp drives EXIO8; Button_Driver.cpp reads EXIO9/10/11), which
  # is why the "schematic says the keys are on 12" folklore is ignored here.
  amp_ctrl: '8'             # PA_EN / amplifier enable - ACTIVE HIGH
  key1_exio: '9'            # volume up  (active low, 10k hardware pull-up)
  key2_exio: '10'           # play/pause
  key3_exio: '11'           # volume down

  # ---------------------------------------------------------------------------
  # Home Assistant / network
  # ---------------------------------------------------------------------------
  hidden_ssid: 'false'      # true = fast_connect, required for a hidden SSID

  # Media player volume clamps (the onboard amp distorts near the top).
  volume_min: '0.4'
  volume_max: '0.8'

  # Clock timezone in POSIX form - the device has no IANA database. It is only
  # a fallback: HA's time platform syncs the clock, and the `set_time_zone` API
  # action overwrites this at runtime (persisted). Grab yours from
  # https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv
  posix_timezone: "UTC0"

  # One-shot "ready" chime played once the device connects to HA. The default is
  # pinned to this fork so published configurations do not depend on upstream or
  # silently change. Override with any URL or local MP3/FLAC/WAV file.
  boot_sound_file: https://github.com/jyoushiki/esphome-waveshare-esp32-s3-audio-va/raw/ea22bd5bc6ac01fd510f85c7f7e47564d22e6c63/base/sounds/startup.mp3

  # Immutable revision used for the bundled Home Assistant Voice PE sounds.
  voice_pe_assets_ref: 0579e7b9d8504264719c593474c85447253c9dc1

  # Immutable revision used for wake-word/VAD manifests and their relative
  # TFLite model files.
  mww_models_ref: 05b65922cc433c9df13e98e32a7fe520758c837e

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # channel_colors (used by the status ring below) requires ESPHome 2026.8.0+.
  min_version: 2026.8.0
  on_boot:
    # Publish a "no timer" placeholder and paint the ring as early as we can, so
    # the device shows life while Wi-Fi/API are still coming up.
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        # Safety net: if HA never connects, stop showing the boot animation.
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        # Restore the alarm settings and the timezone saved in flash.
        - script.execute:
            id: set_validated_alarm_time
            alarm_time_hh_mm: !lambda return id(saved_alarm_time);
        - lambda: |-
            auto call = id(alarm_action).make_call();
            call.set_option(id(saved_alarm_action));
            call.perform();
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();
        - script.execute: apply_wake_word_sensitivity
        # Apply the persisted privacy state only after the microphone component
        # exists. The template switch reports the same backing global.
        - if:
            condition:
              lambda: return id(mic_is_muted);
            then:
              - microphone.mute: i2s_mics
            else:
              - microphone.unmute: i2s_mics

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up micro_wake_word at the cost of more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: octal
  speed: 80MHz

# Full-duplex TDM ownership plus Espressif's software Audio Front End. This
# development branch deliberately tracks the maintainer's current dev branch;
# main remains pinned to a stable audio-stack release.
external_components:
  - source: github://n-IA-hane/esphome-audio-stack@dev
    components: [esp_audio_stack, esp_afe]
    refresh: 0s

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: ${hidden_ssid}
  power_save_mode: none     # audio streaming hates Wi-Fi power saving
  reboot_timeout: 10min
  on_connect:
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

logger:
  # Keep DEBUG compiled in for the runtime Logger Level selector, but avoid its
  # extra noise and formatting work during normal operation.
  level: DEBUG
  initial_level: INFO

api:
  id: api_id
  # Keep the device running when Home Assistant is deliberately offline. Wi-Fi
  # retains its own reboot timeout above for recovery from network failures.
  reboot_timeout: 0s
  # No encryption: this is a LAN-only device on a trusted network, same as the
  # sibling Guition project. To lock it down, add:
  #   encryption:
  #     key: !secret api_encryption_key
  # and put the base64 key in your dashboard's secrets.
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - script.execute:
            id: set_validated_alarm_time
            alarm_time_hh_mm: !lambda return alarm_time_hh_mm;
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome

i2c:
  - id: internal_i2c
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    # All production devices have fixed addresses; scanning is only useful
    # during hardware diagnosis and adds avoidable traffic at startup.
    scan: false
    frequency: 100kHz

# I/O expander: amplifier enable + the three front buttons.
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

time:
  - platform: homeassistant
    id: rtc
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time

# One owner is required for sample-aligned capture and playback. The ES7210
# emits four samples in 32-bit physical TDM slots. On this board
# revision, slots 0 and 2 are the physical microphones, slot 1 is the attenuated
# ES8311 playback reference, and slot 3 is unused. The stack extracts those
# channels and feeds MMR audio to the AFE. This board requires 32-bit codec
# words and slots for working full-duplex capture/playback. A 16 kHz bus keeps
# the complete AFE frame and DMA headroom within the ESP32-S3's internal RAM.
esp_audio_stack:
  id: audio_stack
  processor_id: afe_processor
  sample_rate: 16000
  output_sample_rate: 16000
  bits_per_sample: 32
  slot_bit_width: 32

  i2s_mclk_pin: ${i2s_mclk}
  i2s_bclk_pin: ${i2s_bclk}
  i2s_lrclk_pin: ${i2s_lrclk}
  i2s_din_pin: ${i2s_din}
  i2s_dout_pin: ${i2s_dout}

  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1
  tdm_tx_slot: 0

  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      # Give the two physical microphones 6 dB more analog gain than the
      # previously calibrated baseline. Keep the already-strong analog
      # playback-reference channel at 24 dB so the AEC reference does not clip.
      # This is the zero-based ES7210 ADC input (MIC3), not TDM slot 1.
      gain_db: 30.0
      ref_channel: 2
      ref_gain_db: 24.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true

  # Keep the realtime path out of scarce internal RAM where the component
  # supports it. DMA and ESP-SR still reserve the internal memory they need.
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  master_volume_min_db: -30.0

  # Gate the NS4150B from actual speaker ownership, including sounds which do
  # not produce a useful media_player state transition.
  on_amplifier_required:
    - switch.turn_on: amp_enable
  on_amplifier_idle:
    - switch.turn_off: amp_enable

# Speech-recognition AFE keeps the spectrum suitable for Micro Wake Word while
# removing the device's own playback. Speech Enhancement/BSS combines the two
# physical microphones into the processed mono stream exposed below.
esp_afe:
  id: afe_processor
  # Full-duplex/high-performance is the appropriate AFE profile for
  # simultaneous playback and capture, and it honors the aggressive NLP mode.
  # The synchronized mic/reference channels already match ESP-SR's native
  # 16 kHz, 1024-sample processing frame.
  type: fd
  mode: high_perf
  mic_num: 2
  input_format: mmr
  aec_enabled: true
  aec_filter_length: 4
  aec_nlp_level: aggressive
  se_enabled: true
  # ESP-SR prioritizes dual-mic Speech Enhancement/BSS and removes NS from the
  # effective graph. Keep this explicit so the YAML matches the runtime graph.
  ns_enabled: false
  vad_enabled: false
  # Normalize weak speech after AEC/SE without changing the calibrated analog
  # microphone/reference relationship. Start with ESP-SR's conservative WebRTC
  # defaults; fixed post-AFE gain remains available as a runtime control.
  agc_enabled: true
  agc_compression_gain: 15
  agc_target_level: 3
  memory_alloc_mode: more_psram
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: i2s_mics
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: i2s_audio_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 16000
    bits_per_sample: 16
    timeout: 1s
    buffer_duration: 128ms

  # Mixes the announcement and media pipelines into the one physical output.
  # Mono: the board has a single speaker (mono ES8311 + NS4150B), so a second
  # channel would just be discarded.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # The mixer needs both inputs at one sample rate; these resample if needed.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.05
    volume_min: ${volume_min}
    volume_max: ${volume_max}
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC              # cheapest codec for the S3
      num_channels: 1           # stereo is pointless for announcements
      sample_rate: 48000        # what Music Assistant serves
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1           # mono hardware, one speaker
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
    on_mute:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - delay: 100ms      # debounce
            - script.execute:
                id: control_leds_volume_changed
                volume_level: 0.0
    on_unmute:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - delay: 100ms
            - script.execute:
                id: control_leds_volume_changed
                volume_level: !lambda 'return id(external_media_player).volume;'
    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:
          - delay: 100ms
          - script.execute:
              id: control_leds_volume_changed
              volume_level: !lambda 'return x;'
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/${voice_pe_assets_ref}/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/${voice_pe_assets_ref}/sounds/wake_word_triggered.flac
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/${voice_pe_assets_ref}/sounds/error_cloud_expired.mp3
      - id: boot_sound_custom
        file: ${boot_sound_file}

micro_wake_word:
  id: mww
  microphone: i2s_mics
  stop_after_detection: false
  models:
    - model: https://github.com/esphome/micro-wake-word-models/raw/${mww_models_ref}/models/v2/okay_nabu.json
      id: okay_nabu
    - model: https://github.com/esphome/micro-wake-word-models/raw/${mww_models_ref}/models/v2/hey_jarvis.json
      id: hey_jarvis
    - model: https://github.com/esphome/micro-wake-word-models/raw/${mww_models_ref}/models/v2/alexa.json
      id: alexa
    - model: https://github.com/esphome/micro-wake-word-models/raw/${mww_models_ref}/models/v2/hey_mycroft.json
      id: hey_mycroft
  vad:
    model: https://github.com/esphome/micro-wake-word-models/raw/${mww_models_ref}/models/v2/vad.json
  on_wake_word_detected:
    # Muted (software mute switch)? Do nothing at all.
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          # A timer is ringing -> the wake word just silences it.
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                # Already listening -> the wake word cancels the session.
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    else:
                      # Announcing -> the wake word stops the announcement.
                      - if:
                          condition:
                            media_player.is_announcing:
                          then:
                            - media_player.stop:
                                announcement: true
                          # Otherwise: beep, then start Assist.
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: !lambda return id(wake_word_triggered_sound);
                                  # play_file() is queued, so anchor the delay to
                                  # actual playback rather than the queue call.
                                  # Start listening during the quiet tail of the
                                  # 947 ms file: its audible transient is mostly
                                  # over by 300 ms and AEC removes the remainder.
                                  - wait_until:
                                      condition:
                                        media_player.is_announcing:
                                      timeout: 500ms
                                  - if:
                                      condition:
                                        media_player.is_announcing:
                                      then:
                                        - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: i2s_mics
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
    # One-shot "ready" chime. It MUST run after micro_wake_word.start above: the
    # speaker is a slave to the mic's I2S clock, so playing before the mic is
    # capturing hangs the announcement (and then wake word stops working). The
    # flag is set first so an HA reconnect can't replay it.
    - if:
        condition:
          - lambda: 'return !id(boot_chime_done);'
          - switch.is_on: boot_sound
        then:
          - lambda: id(boot_chime_done) = true;
          - delay: 1s            # let the mic-master clock settle
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(boot_sound_custom);
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # duplicate_wake_up_detected and stt-no-text-recognized are normal; showing
    # a red error ring for them just looks broken.
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 30    # duck music hard while listening
        duration: 0.0s
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A non-empty x means a streaming TTS url reached the media player.
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s            # let the error colour linger a beat
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
    - script.execute: control_leds
  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }
        // The ring is repainted centrally by control_leds().

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "Status Ring"
    pin: ${led_pin}
    num_leds: ${led_num}
    chipset: WS2812
    channel_colors: RGB
    default_transition_length: 150ms
    effects:
      # update_interval must be LONGER than transition_length: it is how often
      # the pulse flips its brightness target (min<->max), not a frame rate. A
      # 16ms interval flips faster than the transition can move, so the ring just
      # sits at one brightness (looks solid). ~2x the transition pulses cleanly.
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 6
          width: 7
      - addressable_color_wipe:
          name: "Wipe"
      # Scan / Twinkle use the phase colour set by control_leds, so they still
      # read as "listening/thinking/replying" while looking different.
      - addressable_scan:
          name: "Scan"
          move_interval: 120ms
          scan_width: 2
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 8%
          progress_interval: 40ms
      - addressable_fireworks:
          name: "Fireworks"
          spark_probability: 12%
          use_random_color: true
      - addressable_random_twinkle:
          name: "Random Twinkle"
          twinkle_probability: 8%
          progress_interval: 40ms
      - addressable_rainbow:
          name: "Rainbow Fast"
          speed: 15
          width: 7
      # Custom effects. current_color is the phase colour set by control_leds,
      # so these still read as the current assistant state.
      - addressable_lambda:
          name: "Comet"
          update_interval: 70ms
          lambda: |-
            static int head = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              int d = (head - i + n) % n;                 // 0 at head, grows behind
              float b = (d < 5) ? (1.0f / (1 << d)) : 0.0f;
              it[i] = Color((uint8_t)(current_color.red   * b),
                            (uint8_t)(current_color.green * b),
                            (uint8_t)(current_color.blue  * b));
            }
            head = (head + 1) % n;
      - addressable_lambda:
          name: "Breathe"
          update_interval: 32ms
          lambda: |-
            static uint16_t t = 0;
            float b = (sinf(t * 3.14159265f / 128.0f) + 1.0f) * 0.5f;  // 0..1
            b = 0.12f + b * 0.88f;                                     // floor 12%
            it.all() = Color((uint8_t)(current_color.red   * b),
                             (uint8_t)(current_color.green * b),
                             (uint8_t)(current_color.blue  * b));
            t = (t + 2) % 256;
      - addressable_lambda:
          name: "Spinner"
          update_interval: 90ms
          lambda: |-
            static int pos = 0;
            const int n = it.size();
            it.all() = Color(0, 0, 0);
            it[pos % n] = current_color;
            it[(pos + 1) % n] = Color((uint8_t)(current_color.red   * 0.35f),
                                      (uint8_t)(current_color.green * 0.35f),
                                      (uint8_t)(current_color.blue  * 0.35f));
            pos = (pos + 1) % n;
      - addressable_lambda:
          name: "Fire"
          update_interval: 70ms
          lambda: |-
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              uint8_t r = 160 + (esp_random() % 96);       // 160..255
              uint8_t g = (uint8_t)(r * (0.20f + (esp_random() % 45) / 255.0f));
              it[i] = Color(r, g, 0);
            }
      # Temporary volume meter. A fractional leading LED makes the player's
      # 1% volume steps visible despite the ring having only seven pixels.
      - addressable_lambda:
          name: "Volume Level"
          update_interval: 50ms
          lambda: |-
            const float level = std::max(0.0f, std::min(1.0f, id(volume_display_level)));
            const int n = it.size();
            const float filled = level * n;
            for (int i = 0; i < n; i++) {
              const float coverage = std::max(0.0f, std::min(1.0f, filled - i));
              const float intensity = 0.025f + 0.975f * coverage;
              // Start beside one edge of the USB-C connector and finish at
              // the LED beside its other edge.
              it[(i + 4) % n] = Color(
                0, (uint8_t)(180 * intensity), (uint8_t)(255 * intensity)
              );
            }

globals:
  - id: mic_is_muted
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Transient pass-through for the current ring colour (set by led_set_effect
  # from its params right before use), so no need to persist across reboots.
  - id: led_ring_color_r
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: led_ring_color_g
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: led_ring_color_b
    type: float
    restore_value: no
    initial_value: '1.0'
  - id: volume_display_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: boot_chime_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: saved_alarm_time
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"${posix_timezone}"'
  - id: saved_alarm_action
    type: std::string
    restore_value: yes
    initial_value: '"Play sound"'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  - id: is_timer_active
    type: bool
    restore_value: no

script:
  # Single entry point for alarm-time state, including restored flash values.
  - id: set_validated_alarm_time
    parameters:
      alarm_time_hh_mm: string
    then:
      - lambda: |-
          const bool format_valid =
            alarm_time_hh_mm.length() == 5 && alarm_time_hh_mm[2] == ':' &&
            alarm_time_hh_mm[0] >= '0' && alarm_time_hh_mm[0] <= '9' &&
            alarm_time_hh_mm[1] >= '0' && alarm_time_hh_mm[1] <= '9' &&
            alarm_time_hh_mm[3] >= '0' && alarm_time_hh_mm[3] <= '9' &&
            alarm_time_hh_mm[4] >= '0' && alarm_time_hh_mm[4] <= '9';
          const int hour = format_valid
            ? (alarm_time_hh_mm[0] - '0') * 10 + (alarm_time_hh_mm[1] - '0')
            : -1;
          const int minute = format_valid
            ? (alarm_time_hh_mm[3] - '0') * 10 + (alarm_time_hh_mm[4] - '0')
            : -1;

          if (format_valid && hour <= 23 && minute <= 59) {
            id(alarm_time).publish_state(alarm_time_hh_mm);
            id(saved_alarm_time) = alarm_time_hh_mm;
          } else {
            ESP_LOGW("alarm", "Rejected invalid alarm time: %s", alarm_time_hh_mm.c_str());
          }

  - id: apply_wake_word_sensitivity
    mode: restart
    then:
      - lambda: |-
          // The okay_nabu, hey_jarvis and hey_mycroft thresholds were calibrated
          // by the Home Assistant Voice PE project against all units and channels
          // of the Dinner Party Corpus (DipCo).
          const auto x = id(wake_word_sensitivity).current_option();

          if (x == "Slightly sensitive") {
            id(hey_jarvis).set_probability_cutoff(247);  // 0.97
            id(alexa).set_probability_cutoff(230);       // 0.90
            id(okay_nabu).set_probability_cutoff(217);   // 0.85
            id(hey_mycroft).set_probability_cutoff(253); // 0.99
          } else if (x == "Moderately sensitive") {
            id(hey_jarvis).set_probability_cutoff(235);  // 0.92
            id(alexa).set_probability_cutoff(191);       // 0.75
            id(okay_nabu).set_probability_cutoff(176);   // 0.69
            id(hey_mycroft).set_probability_cutoff(242); // 0.95
          } else if (x == "Very sensitive") {
            id(hey_jarvis).set_probability_cutoff(212);  // 0.83
            id(alexa).set_probability_cutoff(128);       // 0.50
            id(okay_nabu).set_probability_cutoff(143);   // 0.56
            id(hey_mycroft).set_probability_cutoff(237); // 0.93
          }

          ESP_LOGI(
            "mww",
            "Wake word sensitivity reapplied: %s",
            x.c_str()
          );
  - id: flash_ring
    then:
      - light.turn_on: { id: status_ring, red: 1.0, green: 0.0, blue: 0.0, brightness: 100%, effect: "None" }
      - delay: 250ms
      # Return to the real state instead of going dark (e.g. if a timer is
      # counting or the VA is active while the mic is muted/unmuted).
      - script.execute: control_leds

  # Minimal LED dispatcher: off / solid / a named built-in effect.
  - id: led_set_effect
    mode: restart
    parameters:
      effect: std::string
      r: float
      g: float
      b: float
    then:
      - lambda: |-
          id(led_ring_color_r) = r;
          id(led_ring_color_g) = g;
          id(led_ring_color_b) = b;
          ESP_LOGI("led", "led_set_effect: effect='%s' rgb(%.2f, %.2f, %.2f) brightness=%.2f",
                   effect.c_str(), r, g, b, (float) id(led_ring_brightness).state);
      - if:
          condition:
            lambda: 'return effect == "off";'
          then:
            - light.turn_off: status_ring
          else:
            - if:
                condition:
                  lambda: 'return effect == "solid";'
                then:
                  - light.turn_on:
                      id: status_ring
                      effect: "None"    # clear any running effect so solid is steady
                      brightness: !lambda 'return id(led_ring_brightness).state;'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                else:
                  - light.turn_on:
                      id: status_ring
                      brightness: !lambda 'return id(led_ring_brightness).state;'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                      effect: !lambda 'return effect;'

  # The single LED state machine. Everything that changes device state calls
  # this; nothing else paints the ring directly.
  - id: control_leds
    mode: single
    then:
      - lambda: |-
          const bool wifi_connected = id(wifi_id).is_connected();
          const bool api_connected  = id(api_id).is_connected();
          const bool ringing        = id(timer_ringing).state;
          const bool init_progress  = id(init_in_progress);
          const int  phase          = id(voice_assistant_phase);

          id(check_if_timers_active).execute();
          const bool timers_active = id(is_timer_active);

          ESP_LOGD("led",
                   "control_leds: wifi=%d api=%d init=%d ringing=%d timers_active=%d phase=%d",
                   (int)wifi_connected, (int)api_connected, (int)init_progress, (int)ringing,
                   (int)timers_active, phase);

          auto set = [&](const std::string &effect, float r, float g, float b) {
            id(led_set_effect).execute(effect, r, g, b);
          };

          if (init_progress) {                       // booting
            if (wifi_connected) set("Rainbow Slow", 0.9, 0.1, 0.85);
            else                set("Rainbow Slow", 1.0, 0.1, 0.1);
            return;
          }
          if (!wifi_connected || !api_connected) {   // HA unreachable
            set("Pulse Medium", 1.0, 0.0, 0.0);
            return;
          }
          if (ringing) {                             // timer/alarm ringing
            set("Pulse Fast", 0.6, 0.0, 0.6);
            return;
          }

          switch (phase) {
            case ${voice_assist_waiting_for_command_phase_id}:
              set("solid", 0.5, 0.0, 0.5);           // calm violet: I'm awake
              return;
            case ${voice_assist_listening_for_command_phase_id}:
              set(id(listening_effect).current_option(), 0.8, 0.0, 0.8);
              return;
            case ${voice_assist_thinking_phase_id}:
              set(id(thinking_effect).current_option(), 0.6, 0.0, 0.6);
              return;
            case ${voice_assist_replying_phase_id}:
              set(id(replying_effect).current_option(), 0.6, 0.0, 0.6);
              return;
            case ${voice_assist_error_phase_id}:
              set("Pulse Fast", 1.0, 0.0, 0.0);
              return;
            case ${voice_assist_not_ready_phase_id}:
              set("Pulse Slow", 1.0, 0.0, 0.0);
              return;
            default: break;
          }

          if (timers_active) {                       // a timer is counting down
            set("Pulse Slow", 0.6, 0.0, 0.6);
            return;
          }

          set("off", 0, 0, 0);                       // idle

  # Show the selected volume as a cyan progress bar, then return to the current
  # assistant/timer/connectivity state. Restarting extends the display while
  # consecutive volume commands arrive.
  - id: control_leds_volume_changed
    mode: restart
    parameters:
      volume_level: float
    then:
      - lambda: 'id(volume_display_level) = volume_level;'
      - light.turn_on:
          id: status_ring
          brightness: !lambda 'return id(led_ring_brightness).state;'
          effect: "Volume Level"
      - delay: 1.2s
      - script.execute: control_leds

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: !lambda return id(timer_finished_sound);

  - id: enable_repeat_one
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  - id: disable_repeat
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(sound_file, true, false);
          }

  - id: fetch_first_active_timer
    mode: single
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          const voice_assistant::Timer *next_timer = nullptr;
          for (const auto &timer : timers) {
            if (timer.is_active &&
                (next_timer == nullptr || timer.seconds_left < next_timer->seconds_left)) {
              next_timer = &timer;
            }
          }
          if (next_timer != nullptr) {
            id(first_active_timer) = *next_timer;
          }

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          if (!timers.empty()) {
            for (const auto &timer : timers) {
              if (timer.is_active) {
                output = true;
                break;
              }
            }
          }
          id(is_timer_active) = output;

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          if (id(alarm_on).state && id(alarm_time).has_state()) {
            const auto &set_alarm_time = id(alarm_time).state;
            const int alarm_hour = (set_alarm_time[0] - '0') * 10 + (set_alarm_time[1] - '0');
            const int alarm_minute = (set_alarm_time[3] - '0') * 10 + (set_alarm_time[4] - '0');

            auto time_now = id(rtc).now();
            if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
              std::string action = id(alarm_action).current_option();
              if (action == "Play sound") {
                id(timer_ringing).turn_on();
              } else if (action == "Send event") {
                id(send_alarm_event).execute();
              } else if (action == "Sound and event") {
                id(timer_ringing).turn_on();
                id(send_alarm_event).execute();
              }
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  - id: publish_current_time
    mode: single
    then:
      - lambda: |-
          static std::string last_time_string = "";
          auto time_now = id(rtc).now();
          std::string current_time_string = time_now.strftime("%H:%M");
          if (current_time_string != last_time_string) {
            id(current_time).publish_state(current_time_string);
            last_time_string = current_time_string;
          }

select:
  - platform: template
    name: "Wake word sensitivity"
    id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    # Probability cutoffs are quantised uint8 (255 = 1.0); the comment on each
    # line is the floating point value. FAPH = false accepts per hour measured
    # against the Dinner Party Corpus. Values apply to the models pinned above.
    on_value:
      - script.execute: apply_wake_word_sensitivity

  # Pick the ring animation for each voice-assistant phase, from HA, live.
  # The option strings must match effect names in the light's `effects:` block
  # (plus "solid"). control_leds reads these; the phase colour stays fixed.
  - platform: template
    name: "Listening effect"
    id: listening_effect
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Comet"
    options: &va_ring_effects
      - solid
      - Pulse Slow
      - Pulse Medium
      - Pulse Fast
      - Breathe
      - Wipe
      - Scan
      - Spinner
      - Comet
      - Twinkle
      - Random Twinkle
      - Fireworks
      - Fire
      - Rainbow Slow
      - Rainbow Fast
    # This trigger also fires while restore_value replays the saved option during
    # setup() (HARDWARE priority), before the light/RMT and voice_assistant are
    # up. Running control_leds then paints an effect on an uninitialised strip and
    # crashes the boot, so gate it until on_boot (-100) clears init_in_progress.
    on_value: &repaint_if_ready
      - if:
          condition:
            lambda: 'return !id(init_in_progress);'
          then:
            - script.execute: control_leds
  - platform: template
    name: "Thinking effect"
    id: thinking_effect
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Pulse Fast"
    options: *va_ring_effects
    on_value: *repaint_if_ready
  - platform: template
    name: "Replying effect"
    id: replying_effect
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Wipe"
    options: *va_ring_effects
    on_value: *repaint_if_ready

  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true
  - platform: template
    optimistic: true
    name: "Alarm action"
    id: alarm_action
    icon: mdi:bell-plus
    internal: true              # daily-alarm feature, hidden from HA
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    on_value:
      then:
        - lambda: |-
            id(saved_alarm_action) = x;

switch:
  # Live AEC control inside the active AFE. Disabling it leaves dual-mic BSS and
  # post-AFE AGC running, so this entity controls only what its name says.
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_enabled
      name: "Echo cancellation"
      restore_mode: RESTORE_DEFAULT_ON
      entity_category: config
      disabled_by_default: true

  # Complete processor bypass for diagnostic A/B recordings. ON is the normal
  # path through AEC/BSS/AGC; OFF publishes the converted raw microphones. This
  # is intentionally separate from the user-facing AEC control above.
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    aec:
      id: afe_processing_enabled
      name: "AFE processing"
      restore_mode: RESTORE_DEFAULT_ON
      entity_category: diagnostic
      disabled_by_default: true

  - platform: gpio
    id: amp_enable
    internal: true
    pin:
      tca9555: ioexp
      number: ${amp_ctrl}
      inverted: false
    # OFF at boot so the amp doesn't amplify the undriven DAC line as a hiss
    # before the speaker's first playback. Audio-stack lifecycle hooks above
    # turn it on only while the hardware speaker path is actually required.
    restore_mode: ALWAYS_OFF

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    # The state comes from a flash-backed global because a lambda switch cannot
    # restore itself. DISABLED is essential: the implicit ALWAYS_OFF mode would
    # run turn_off_action during setup and overwrite the restored global before
    # on_boot can apply it to the initialized microphone.
    restore_mode: DISABLED
    lambda: |-
      return id(mic_is_muted);
    # A real mute, via ESPHome's own primitive: microphone.mute makes the
    # Microphone hand every consumer a zero-filled buffer, so the wake word
    # literally hears silence. The stream keeps running, so there is no I2S
    # restart and no start/stop race.
    #
    # The previous implementation dropped the ES7210 gain to 0.0f - but 0 dB is
    # UNITY gain, not silence. The mic kept hearing the room and only the wake
    # word handler ignored it.
    turn_on_action:
      - lambda: id(mic_is_muted) = true;
      - microphone.mute: i2s_mics
      - script.execute: flash_ring
    turn_off_action:
      - lambda: id(mic_is_muted) = false;
      - microphone.unmute: i2s_mics
      - script.execute: flash_ring

  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: boot_sound
    name: Boot sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 15min           # give up if nobody stops it
      - switch.turn_off: timer_ringing
    on_turn_off:
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
          then:
            media_player.stop:
              announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds

  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    internal: true              # daily-alarm feature, hidden from HA
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

number:
  # Runtime gain is deliberately applied after AEC/AFE. The ES7210 hardware
  # gain stays at 30 dB for the physical mics and 24 dB for the reference, so
  # changing this control cannot alter the relationship seen by the processor.
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    mic_gain:
      id: mic_gain_db
      name: "Mic gain (post-AFE)"
      min_value: -20.0
      max_value: 30.0

  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
                id: status_ring
                brightness: !lambda 'return x;'

sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    update_interval: never
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring
    internal: true              # daily-alarm feature, hidden from HA
    update_interval: never
  # Published for the alarm/clock logic, but not shown in HA (it's just the
  # device's own clock, which HA already has).
  - platform: template
    id: current_time
    internal: true
    update_interval: never

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    id: volume_up_button
    name: "Volume up button"
    internal: true
    pin:
      tca9555: ioexp
      number: ${key1_exio}
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player

  - platform: gpio
    id: media_play_pause_button
    name: "Media play-pause button"
    internal: true
    pin:
      tca9555: ioexp
      number: ${key2_exio}
      inverted: true
    on_press:
      - media_player.toggle: external_media_player

  - platform: gpio
    id: volume_down_button
    name: "Volume down button"
    internal: true
    pin:
      tca9555: ioexp
      number: ${key3_exio}
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player
