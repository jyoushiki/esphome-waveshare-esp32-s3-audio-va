name: Release firmware

on:
  workflow_dispatch:
  # Allows an explicit validation build from a non-default branch without
  # running this expensive firmware build on every development commit.
  push:
    tags:
      - "firmware-build-*"
  release:
    types: [published]

# Manual runs build downloadable Actions artifacts for validation. Publishing
# a GitHub release additionally uploads the same binaries and web manifest to
# that release. The reusable workflows are pinned to the revision used by the
# official ESPHome project template.
permissions:
  contents: read

jobs:
  build:
    name: Build universal firmware
    uses: esphome/workflows/.github/workflows/build.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6
    with:
      files: prebuilt/waveshare-va.factory.yaml
      esphome-version: 2026.8.2
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}

  upload:
    name: Attach firmware to release
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@0fdd5e311b7e744069166696072a1a9cbc5fbeb6
    with:
      version: ${{ needs.build.outputs.version }}
