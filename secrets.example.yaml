# Optional source-build secrets. Copy to secrets.yaml (kept out of git) only
# when you want to compile Wi-Fi credentials into the image.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# The API is unencrypted by default (LAN-only device). If you enable encryption
# in waveshare-va.yaml, add the base64 key here too:
#   https://esphome.io/components/api.html#configuration-variables
# api_encryption_key: "PUT_YOUR_OWN_BASE64_KEY_HERE"
